interface:
  display_name: "GitHub PR Review"
  short_description: "Review GitHub.com pull requests for bugs and risk."
  default_prompt: >-
    Use $gh-pr-review to review a GitHub.com pull request reachable through gh.
    Obtain complete paginated PR context, draft Review JSON v2 with base and
    head SHAs, persist it with save, show preview output verbatim, iterate
    through save and preview for edits, and submit the exact displayed file
    only after explicit approval and live base/head validation. Use reconcile
    only to verify an already-existing GitHub review.
